<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardAgain - Shared Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 16px; opacity: 0.9; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #fff;
      color: #764ba2;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .btn-secondary {
      display: inline-block;
      margin-top: 12px;
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.4);
      font-size: 14px;
      font-weight: 500;
      padding: 12px 32px;
      border-radius: 12px;
      text-decoration: none;
      width: 100%;
      cursor: pointer;
    }
    .spinner {
      display: none;
      margin: 16px auto;
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; opacity: 0.8; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💌</div>
    <h1>Someone shared a card with you!</h1>
    <p>Open this link in the CardAgain app to add this card to your collection.</p>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Opening CardAgain...</p>
    <button class="btn" id="openBtn" onclick="openApp()">Open in CardAgain</button>
    <a class="btn-secondary" id="storeBtn" href="#" style="display:none;">Download CardAgain</a>
  </div>

  <script>
    // Extract share code from query param: /share?code=ABCD1234
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (code) code = code.toUpperCase();

    // App Store URL — update this after publishing
    var APP_STORE_URL = 'https://apps.apple.com/app/cardagain/id__YOUR_APP_STORE_ID__';

    function openApp() {
      if (!code) {
        document.getElementById('status').textContent = 'Invalid share link.';
        document.getElementById('status').style.display = 'block';
        return;
      }

      var deepLink = 'cardagain://share/' + code;
      var btn = document.getElementById('openBtn');
      var spinner = document.getElementById('spinner');
      var status = document.getElementById('status');
      var storeBtn = document.getElementById('storeBtn');

      btn.style.display = 'none';
      spinner.style.display = 'block';
      status.style.display = 'block';

      // Try opening the app
      window.location.href = deepLink;

      // If the app didn't open after 1.5s, show App Store button
      setTimeout(function() {
        spinner.style.display = 'none';
        status.textContent = "Don't have CardAgain yet?";
        storeBtn.style.display = 'inline-block';
        storeBtn.href = APP_STORE_URL;
        btn.style.display = 'inline-block';
        btn.textContent = 'Try Again';
      }, 1500);
    }

    // Auto-attempt to open app on page load
    if (code) {
      openApp();
    }
  </script>
</body>
</html>
